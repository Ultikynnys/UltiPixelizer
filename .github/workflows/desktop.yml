name: Build desktop apps

# Builds standalone Tauri apps for Windows and Linux and publishes them. Runs
# only when a version tag (v*) is pushed or the workflow is dispatched
# manually. Ordinary commits to main do NOT trigger this workflow: pushes
# stay free, and the expensive 2-OS Rust build only runs when a release is
# actually wanted. The release tag is the build version (the same git build
# count the in-app badge uses, split into semver: v125 -> 1.2.5) and the
# installers are attached to a published GitHub Release. A tag push made with
# GITHUB_TOKEN does NOT re-trigger workflows. workflow_dispatch re-runs the
# current commit and updates the same release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # The version tag is pushed with GITHUB_TOKEN, but only when it is missing
  # (e.g. a manual dispatch on a commit that was never tagged). GITHUB_TOKEN
  # pushes do NOT re-trigger workflows, so the tag push never loops back into
  # this workflow. Tag-triggered runs find the tag already exists and reuse it.

# Serialize runs so queued tag pushes publish in order instead of racing.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` (the build number the
          # badge and installer version derive from) counts real commits — the
          # default shallow checkout would always report 1.
          fetch-depth: 0
      - name: Install dependencies and stamp build version
        uses: ./.github/actions/prepare
        with:
          tauri-version: true

      # WebKitGTK + packaging deps required to compile the Tauri Rust crate and
      # produce AppImage/deb bundles on Ubuntu (per the Tauri v2 docs).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Test
        run: npm test

      # Installs the Rust toolchain and packages the installers. No release is
      # created here — the matrix jobs would race; the release job below
      # publishes the combined installers to the version tag.
      - name: Build and package (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.version.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Only the installers ship in the artifact — the bundle dir also keeps
      # staging leftovers (UltiPixelizer.AppDir/, the deb package dir) that
      # would otherwise end up as junk release assets.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The release tag is the same version the installers were stamped with —
      # recomputed here from the identical git build count (same commit, so it
      # matches the build job).
      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "version=$(node scripts/build-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Published (not draft) so the files are immediately downloadable from
      # the release page. Re-running the workflow for the same commit updates
      # the existing release instead of failing.
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # The artifact now carries only installer files, but keep the file
          # collection robust: upload files at any depth (never directories,
          # which gh rejects), deduped case-insensitively by basename
          # (GitHub treats release asset names case-insensitively).
          declare -A SEEN=()
          INSTALLERS=()
          while IFS= read -r -d '' FILE; do
            NAME=${FILE##*/}
            NAME=${NAME,,}
            if [[ -z ${SEEN[$NAME]+x} ]]; then
              SEEN[$NAME]=1
              INSTALLERS+=("$FILE")
            fi
          done < <(find release -type f -print0)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${INSTALLERS[@]}" --clobber
          else
            gh release create "$TAG" "${INSTALLERS[@]}" \
              --title "UltiPixelizer $TAG" \
              --notes "Standalone UltiPixelizer build (Windows .msi/.exe, Linux .AppImage/.deb). All processing stays on-device."
          fi

      # Publish the same installers to itch.io (r60d.itch.io/ultipixelizer).
      # butler authenticates from the BUTLER_API_KEY env var, which GitHub
      # injects from the BUTLER_API_KEY repository secret — the key never
      # appears in this file or in build logs. The version tag (v2.6.6, from
      # the same git build count as the release) becomes the itch user-version.
      - name: Install butler
        shell: bash
        run: |
          curl -sL -o butler.zip "https://github.com/itchio/butler/releases/download/v15.30.0/butler-linux-amd64.zip"
          unzip -o butler.zip
          chmod +x butler/butler
          echo "$PWD/butler" >> "$GITHUB_PATH"

      - name: Push installers to itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Stage each channel's files in its own dir (butler pushes one src
          # dir per channel), then push both. Windows carries the NSIS .exe;
          # Linux carries the .AppImage and .deb.
          mkdir -p itch/windows itch/linux
          cp release/*.exe itch/windows/ 2>/dev/null || true
          cp release/*.AppImage release/*.deb itch/linux/ 2>/dev/null || true
          butler push itch/windows r60d/ultipixelizer:windows --userversion "$VERSION"
          butler push itch/linux r60d/ultipixelizer:linux --userversion "$VERSION"
