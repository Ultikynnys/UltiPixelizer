name: Build desktop apps

# Builds standalone Tauri apps for Windows and Linux and publishes them. Every
# push to main is packaged into installers, tagged with the build version (the
# same git build count the in-app badge uses, split into semver — v125 ->
# 1.2.5) and attached to a published GitHub Release. The tag push uses
# GITHUB_TOKEN, which does NOT re-trigger workflows. workflow_dispatch
# re-runs the current commit and updates the same release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Note: the GITHUB_TOKEN can never push a tag that modifies .github/workflows
  # files — `workflows` is not a valid key in the permissions block (the schema
  # rejects it), and the token is refused at the git layer regardless. Releases
  # therefore auto-publish only for commits that don't touch workflow files:
  # after a workflow change, the first ordinary commit gets the tag instead.

# Serialize runs so queued pushes publish in order instead of racing on tags.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` (the build number the
          # badge and installer version derive from) counts real commits —
          # the default shallow checkout would always report 1.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WebKitGTK + packaging deps required to compile the Tauri Rust crate and
      # produce AppImage/deb bundles on Ubuntu (per the Tauri v2 docs).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Test
        run: npm test

      # The build version badge (topbar) is stamped at build time by Vite. The
      # installer version is generated from the SAME git build count via
      # scripts/build-version.mjs — a static 2.0.0 OFFSET (200) is added to
      # the commit count and split into semver digits, and the badge shows the
      # same offset count, so the topbar `v209` always matches installer
      # `2.0.9` (commit 1 -> v201/2.0.1; the squash to one commit keeps
      # releases in the 2.0.x range instead of downgrading to 0.0.1) — written
      # to src-tauri/tauri.version.json, which tauri-action merges into the
      # bundle config with --config — no version is hardcoded here, in
      # tauri.conf.json, or in any env file; local `npm run tauri:build`
      # derives it the exact same way.
      - name: Set build version
        shell: bash
        run: |
          BUILD_NUMBER=$(node scripts/build-version.mjs --count)
          echo "VITE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "VITE_COMMIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          node scripts/write-tauri-version.mjs

      # Installs the Rust toolchain and packages the installers. No release is
      # created here — the matrix jobs would race; the release job below
      # publishes the combined installers to the version tag.
      - name: Build and package (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.version.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Only the installers ship in the artifact — the bundle dir also keeps
      # staging leftovers (UltiPixelizer.AppDir/, the deb package dir) that
      # would otherwise end up as junk release assets.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The release tag is the same version the installers were stamped with —
      # recomputed here from the identical git build count (same commit, so it
      # matches the build job).
      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "version=$(node scripts/build-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Published (not draft) so the files are immediately downloadable from
      # the release page. Re-running the workflow for the same commit updates
      # the existing release instead of failing.
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # The artifact now carries only installer files, but keep the file
          # collection robust: upload files at any depth (never directories,
          # which gh rejects), deduped case-insensitively by basename
          # (GitHub treats release asset names case-insensitively).
          declare -A SEEN=()
          INSTALLERS=()
          while IFS= read -r -d '' FILE; do
            NAME=${FILE##*/}
            NAME=${NAME,,}
            if [[ -z ${SEEN[$NAME]+x} ]]; then
              SEEN[$NAME]=1
              INSTALLERS+=("$FILE")
            fi
          done < <(find release -type f -print0)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${INSTALLERS[@]}" --clobber
          else
            gh release create "$TAG" "${INSTALLERS[@]}" \
              --title "UltiPixelizer $TAG" \
              --notes "Standalone UltiPixelizer build (Windows .msi/.exe, Linux .AppImage/.deb). All processing stays on-device."
          fi
