name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
    # Skip the whole pipeline for docs/marketing-only commits: the tests,
    # build and Pages deploy add nothing for these, and every skipped run
    # saves minutes plus action-download bandwidth (which has been hitting
    # GitHub rate limits, 429/503 on action archive downloads). Note: a push
    # that changes this workflow file still runs, by design.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'Example/**'
      - 'itch-description.html'
      - 'dump.txt'
      - 'dump2.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` (the build number the
          # badge and installer version derive from) counts real commits — the
          # default shallow checkout would always report 1.
          fetch-depth: 0
      - name: Install dependencies and stamp build version
        uses: ./.github/actions/prepare
      - name: Test core systems with coverage
        run: npm run test:coverage
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Stage media for Pages
        run: cp -r Assets dist/Assets
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
