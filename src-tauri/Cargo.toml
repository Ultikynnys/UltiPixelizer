[package]
name = "ultipixelizer"
version = "1.0.0"
description = "Local browser-based texture pixelation and palette dithering studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "ultipixelizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
